<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
  <title id="title">An evolving task in EgoUseBench</title>
  <desc id="desc">The wearer first asks for a small jar of ground spice, then requests a one-kilogram refill bag instead. The agent saves the refill bag in the website cart.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1d2a2e"/>
      <stop offset="1" stop-color="#10191d"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffc48f"/>
      <stop offset="1" stop-color="#ff9a59"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a0b3b7" stroke-opacity=".095"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="958" height="363" rx="24"/></clipPath>
    <g id="bag">
      <path d="M16 2h68l-3 15 9 88q1 8-8 8H18q-9 0-8-8l9-88z" fill="url(#accent)" stroke="#ffcdac" stroke-width="2"/>
      <path d="M18 16h63M14 99h72" fill="none" stroke="#975531" stroke-width="2"/>
      <rect x="25" y="35" width="50" height="46" rx="5" fill="#253235"/>
      <path d="M38 62q6-18 23-14-2 16-23 14zm0 1 19-12" fill="none" stroke="#ffd2ac" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      <path d="M39 71h22" stroke="#ffd2ac" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="1" y="1" width="958" height="363" rx="24" fill="url(#panel)" stroke="#546265" stroke-width="2"/>
  <g clip-path="url(#bounds)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <path d="M0 0H960V237H0z" fill="url(#grid)"/>
    <path d="M40 63h880" stroke="#b7c8c7" stroke-opacity=".22"/>
    <g transform="translate(38 28) scale(.035)" fill="#f5e9db">
      <path d="M500 52C430 18 300 10 170 14C60 18 14 60 12 150C10 260 40 380 140 420C240 458 360 452 420 400C450 372 470 330 500 326C530 330 550 372 580 400C640 452 760 458 860 420C960 380 990 260 988 150C986 60 940 18 830 14C700 10 570 18 500 52Z"/>
    </g>
    <text x="87" y="42" fill="#e9eee9" font-size="19" font-weight="700" letter-spacing="1.6">ONLINE EGO USE</text>
    <text x="919" y="42" fill="#b0c3c1" font-size="18" font-weight="600" text-anchor="end">Example · Graft</text>

    <path d="M168 146H792" stroke="#87a6a2" stroke-opacity=".4" stroke-width="2" stroke-dasharray="4 7"/>
    <path d="M306 139l7 7-7 7m307-14 7 7-7 7" fill="none" stroke="#ffb584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Initial request: the jar is the in-world referent. -->
    <circle cx="168" cy="146" r="63" fill="#2c3e40" stroke="#718b87" stroke-opacity=".6"/>
    <g transform="translate(133 96)">
      <path d="M10 25h50l6 12v47q0 9-9 9H13q-9 0-9-9V37z" fill="#b98563" stroke="#f6ddc3" stroke-width="2"/>
      <rect x="9" y="16" width="52" height="13" rx="4" fill="#e9c7a7"/>
      <rect x="12" y="45" width="46" height="31" rx="4" fill="#f1dec3"/>
      <path d="M26 56h18m-14 8h10" stroke="#71513d" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Mid-task update: the requested package changes. -->
    <circle cx="480" cy="146" r="63" fill="#4d322a" stroke="#ffac7b" stroke-width="2"/>
    <use href="#bag" x="0" y="0" transform="translate(443 103) scale(.74)"/>

    <!-- The checker reads what is in the final website cart. -->
    <circle cx="792" cy="146" r="63" fill="#2c3e40" stroke="#718b87" stroke-opacity=".6"/>
    <g transform="translate(741 109)">
      <rect x="1" y="1" width="100" height="73" rx="9" fill="#17272a" stroke="#8cb3ab" stroke-width="2"/>
      <path d="M1 18h100" stroke="#8cb3ab" stroke-opacity=".6"/>
      <circle cx="11" cy="10" r="2" fill="#b4cebe"/>
      <circle cx="19" cy="10" r="2" fill="#b4cebe"/>
      <use href="#bag" x="0" y="0" transform="translate(15 24) scale(.35)"/>
      <circle cx="72" cy="46" r="14" fill="#b4dfbf"/>
      <path d="m66 46 4 4 8-9" fill="none" stroke="#203d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M0 226h960v139H0z" fill="#131d21"/>
    <path d="M0 226h960M324 245v90m312-90v90" stroke="#768b8a" stroke-opacity=".34"/>
    <g text-anchor="middle">
      <text x="168" y="262" fill="#a9c3bd" font-size="18" font-weight="700" letter-spacing="1.2">01 · INITIAL REQUEST</text>
      <text x="168" y="303" fill="#f5eee4" font-size="33" font-weight="700">A small jar</text>
      <text x="168" y="331" fill="#c2cfcb" font-size="20">of the spice in view</text>

      <text x="480" y="262" fill="#ffb584" font-size="18" font-weight="700" letter-spacing="1.2">02 · REQUEST UPDATE</text>
      <text x="480" y="303" fill="#f5eee4" font-size="33" font-weight="700">A 1 kg refill</text>
      <text x="480" y="331" fill="#c2cfcb" font-size="20">instead of the jar</text>

      <text x="792" y="262" fill="#a9c3bd" font-size="18" font-weight="700" letter-spacing="1.2">03 · FINAL CART</text>
      <text x="792" y="303" fill="#f5eee4" font-size="33" font-weight="700">Refill bag</text>
      <text x="792" y="331" fill="#c2cfcb" font-size="20">matches the revised request</text>
    </g>
  </g>
</svg>
