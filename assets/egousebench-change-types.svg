<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Three kinds of change in Online Ego Use</title>
  <desc id="desc">Graft: the user revises the request mid-task. Refresh: new first-person frames arrive while the request stays the same. Clarify: the agent asks the user which object they meant before acting.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#1d2a2e"/>
      <stop offset="1" stop-color="#10191d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a0b3b7" stroke-opacity=".095"/>
    </pattern>
    <g id="bubble">
      <path d="M8 0h64q8 0 8 8v34q0 8-8 8H30l-14 12v-12H8q-8 0-8-8V8q0-8 8-8z"/>
    </g>
    <g id="frame">
      <rect width="84" height="60" rx="8"/>
    </g>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- Graft -->
    <g transform="translate(8 8)">
      <rect width="306" height="284" rx="20" fill="url(#panel)" stroke="#546265" stroke-width="2"/>
      <path d="M2 2h302v150H2z" fill="url(#grid)"/>
      <text x="24" y="40" fill="#ff7a85" font-size="17" font-weight="700" letter-spacing="1.6">GRAFT</text>
      <text x="282" y="40" fill="#8fa5a2" font-size="15" text-anchor="end">request update</text>
      <use href="#bubble" transform="translate(40 76)" fill="#2c3e40" stroke="#718b87" stroke-width="2"/>
      <path d="M56 92h48M56 106h32" stroke="#c2cfcb" stroke-width="3" stroke-linecap="round"/>
      <path d="M134 104h30" stroke="#87a6a2" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6"/>
      <path d="m166 98 7 6-7 6" fill="none" stroke="#ff7a85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#bubble" transform="translate(186 76)" fill="#4d2a31" stroke="#ff7a85" stroke-width="2"/>
      <path d="M202 92h48M202 106h22" stroke="#ffc4ca" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 168h306" stroke="#768b8a" stroke-opacity=".34"/>
      <text x="24" y="210" fill="#f5eee4" font-size="24" font-weight="700">The user changes</text>
      <text x="24" y="238" fill="#f5eee4" font-size="24" font-weight="700">their mind</text>
      <text x="24" y="266" fill="#c2cfcb" font-size="15">The cart must follow the new request.</text>
    </g>

    <!-- Refresh -->
    <g transform="translate(327 8)">
      <rect width="306" height="284" rx="20" fill="url(#panel)" stroke="#546265" stroke-width="2"/>
      <path d="M2 2h302v150H2z" fill="url(#grid)"/>
      <text x="24" y="40" fill="#9fd8c4" font-size="17" font-weight="700" letter-spacing="1.6">REFRESH</text>
      <text x="282" y="40" fill="#8fa5a2" font-size="15" text-anchor="end">new evidence</text>
      <use href="#frame" transform="translate(32 76)" fill="#2c3e40" stroke="#718b87" stroke-width="2"/>
      <circle cx="62" cy="112" r="11" fill="#b98563"/>
      <rect x="80" y="100" width="22" height="24" rx="4" fill="#71858a"/>
      <path d="M134 106h30" stroke="#87a6a2" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6"/>
      <path d="m166 100 7 6-7 6" fill="none" stroke="#9fd8c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#frame" transform="translate(190 76)" fill="#1f3a35" stroke="#9fd8c4" stroke-width="2"/>
      <circle cx="220" cy="112" r="11" fill="#b98563"/>
      <rect x="238" y="96" width="22" height="30" rx="4" fill="#9fd8c4"/>
      <path d="M244 106h10" stroke="#1f3a35" stroke-width="2" stroke-linecap="round"/>
      <path d="M0 168h306" stroke="#768b8a" stroke-opacity=".34"/>
      <text x="24" y="210" fill="#f5eee4" font-size="24" font-weight="700">The scene reveals</text>
      <text x="24" y="238" fill="#f5eee4" font-size="24" font-weight="700">something new</text>
      <text x="24" y="266" fill="#c2cfcb" font-size="15">Same request, newer frames decide.</text>
    </g>

    <!-- Clarify -->
    <g transform="translate(646 8)">
      <rect width="306" height="284" rx="20" fill="url(#panel)" stroke="#546265" stroke-width="2"/>
      <path d="M2 2h302v150H2z" fill="url(#grid)"/>
      <text x="24" y="40" fill="#b8b4ff" font-size="17" font-weight="700" letter-spacing="1.6">CLARIFY</text>
      <text x="282" y="40" fill="#8fa5a2" font-size="15" text-anchor="end">ambiguous reference</text>
      <use href="#bubble" transform="translate(40 76)" fill="#2c3e40" stroke="#718b87" stroke-width="2"/>
      <text x="80" y="113" fill="#f5eee4" font-size="30" font-weight="700" text-anchor="middle">?</text>
      <path d="M134 104h30" stroke="#87a6a2" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 6"/>
      <path d="m166 98 7 6-7 6" fill="none" stroke="#b8b4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <use href="#bubble" transform="translate(186 76)" fill="#2e2c4d" stroke="#b8b4ff" stroke-width="2"/>
      <path d="m214 101 8 8 16-17" fill="none" stroke="#d9d6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 168h306" stroke="#768b8a" stroke-opacity=".34"/>
      <text x="24" y="210" fill="#f5eee4" font-size="24" font-weight="700">"That one" could</text>
      <text x="24" y="238" fill="#f5eee4" font-size="24" font-weight="700">mean two things</text>
      <text x="24" y="266" fill="#c2cfcb" font-size="15">The agent may ask before it acts.</text>
    </g>
  </g>
</svg>
