<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EgoCUA-Bench 人工审核{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('review_index', view=current_review_view) }}">EgoCUA-Bench 任务工作台</a>
    <a href="{{ url_for('sample_review_index') }}">40题质量核查</a>
    <a href="{{ url_for('update_count_index') }}">更新次数对照</a>
    <span>{{ workspace_reviewer if workspace_reviewer is defined else '' }}</span>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='review.js') }}"></script>
</body>
</html>
