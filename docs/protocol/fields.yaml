categories:
  identity:
    fields:
      - name: item_id
        definition: Stable identifier for a research claim, protocol rule, or benchmark item.
      - name: track
        definition: graft, refresh, clarify, common, or statistical.
      - name: subtype
        definition: Track-specific subgroup used for stratification rather than pooled scoring.

  construct:
    fields:
      - name: construct_name
        definition: The capability the item or metric is intended to measure.
      - name: operational_definition
        definition: Observable condition under which the construct is measured.
      - name: claim_scope
        definition: The strongest scientific claim licensed by the evidence.
      - name: excluded_interpretations
        definition: Nearby claims that the measurement does not establish.

  task_design:
    fields:
      - name: natural_language_claim
        definition: Human-readable statement of the desired final outcome.
      - name: formal_goal_predicate
        definition: Deterministic predicate over the frozen environment's post-state.
      - name: dynamic_event
        definition: The single instruction update, visual update, or clarification event exercised by the task.
      - name: invariants
        definition: Catalog, initial state, final goal, budget, model, and harness properties held fixed.
      - name: information_necessity
        definition: Evidence that the injected instruction, visual packet, or clarification answer is necessary for the treatment task.
      - name: human_solvability
        definition: Independent-human protocol-valid completion under the exact released interface, with success required only when the arm contains enough information to determine the target.
      - name: exclusion_reason
        definition: Predeclared reason for revising or removing an invalid item.

  validation:
    fields:
      - name: run_valid
        definition: Whether the harness delivered required inputs/events and recorded a complete, interpretable run.
      - name: goal_pass
        definition: Whether the final backend state satisfies one declared acceptable goal state.
      - name: policy_pass
        definition: Whether an explicitly required process constraint was satisfied; absent unless the task claim requires it.
      - name: evidence_status
        definition: PASS, FAIL, or UNKNOWN based on retained decisive artifacts.
      - name: decisive_artifacts
        definition: Pre-state, post-state, event delivery log, action trace, and evaluator inputs/output needed to reproduce the judgment.
      - name: infrastructure_failure
        definition: Non-agent fault that invalidates and reruns a trial rather than counting as task failure.

  metrics:
    fields:
      - name: metric_name
        definition: Stable, non-interpretive metric label.
      - name: formula
        definition: Numerator, denominator, conditioning set, and sign convention.
      - name: unit_of_analysis
        definition: Task success, run-level diagnostic, or audited case.
      - name: primary_or_secondary
        definition: Preregistered status within a track or subtype.
      - name: censoring_rule
        definition: How failures, missing values, timeouts, and undelivered events enter the estimate.
      - name: uncertainty
        definition: Task-cluster bootstrap interval or audited evidence-supported bounds.
      - name: interpretation_limit
        definition: What cannot be inferred from the observed metric.

  evidence:
    fields:
      - name: consensus_level
        definition: established_consensus, emerging_practice, or project_choice.
      - name: source
        definition: Primary paper, official benchmark page, protocol, or source code.
      - name: direct_support
        definition: The exact design proposition supported by the source.
      - name: caveat
        definition: Limitation of the source or mismatch with EgoCUA-Bench.

detail_levels:
  minimal:
    required:
      - item_id
      - construct_name
      - formal_goal_predicate
      - metric_name
      - formula
      - consensus_level
      - source
  standard:
    required:
      - treatment_variable
      - invariants
      - run_valid
      - goal_pass
      - evidence_status
      - unit_of_analysis
      - interpretation_limit
  audit:
    required:
      - information_necessity
      - human_solvability
      - decisive_artifacts
      - censoring_rule
      - uncertainty
      - direct_support
      - caveat

uncertain_or_to_be_empirically_calibrated:
  - Exactly-two-candidate clarification design and its realized forced-execution baseline.
  - Fixed 1/3/4/8 distractor tiers as a valid difficulty scale.
  - One-question clarification limit and the user-cost coefficient.
  - Progress-triggered versus wall-clock event timing generalization.
  - Number of stochastic replicates required for stable model comparisons.
  - Formal-sample size after pilot variance estimates.
  - Whether the proposed three-track taxonomy is complete beyond the benchmark's scoped setting.
