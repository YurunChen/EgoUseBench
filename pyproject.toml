[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egocua-bench"
version = "0.1.0"
description = "Three-track diagnostic benchmark for egocentric web agents"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "pillow>=11,<13",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
browser-use = [
    "browser-use[core]>=0.13,<0.14",
    "socksio>=1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "types-requests>=2.32,<3",
]

[project.scripts]
egocua = "egocua.cli:main"

[tool.setuptools.packages.find]
include = ["egocua*", "sites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
